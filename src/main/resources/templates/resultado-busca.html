<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Resultado da Busca</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">

    <style>
        .container {
            padding: 40px;
            color: white;
        }

        .card {
            background-color: #0d1b2a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<div class="container">

    <h1>Resultado da busca</h1>

    <div class="card" th:each="viagem : ${viagens}">

        <h2>
            <span th:text="${viagem.cidadeOrigem.nome}"></span>
            →
            <span th:text="${viagem.cidadeDestino.nome}"></span>
        </h2>

        <p>
            Valor:
            R$
            <span th:text="${viagem.valorPassagem}"></span>
        </p>

        <p>
            Distância:
            <span th:text="${viagem.distanciaKm}"></span> km
        </p>

    </div>

</div>

</body>
</html>
