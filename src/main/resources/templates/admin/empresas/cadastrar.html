<div id="cadastrar-modal" class="modal-overlay" th:fragment="cadastrar">
    <div class="modal">
        <div class="modal-header">
            <div>
                <h3>Adicionar empresa</h3>
                <p>Preencha as informações da nova empresa</p>
            </div>

            <button type="button" class="modal-close" onclick="fecharModalCadastrar()">×</button>
        </div>

        <form class="modal-form" method="post" th:action="@{/admin/empresas}">
            <div class="form-group">
                <label for="razaoSocial">Razão social</label>
                <input type="text" id="razaoSocial" name="razaoSocial" maxlength="200" required>
            </div>

            <div class="form-group">
                <label for="nomeFantasia">Nome fantasia</label>
                <input type="text" id="nomeFantasia" name="nomeFantasia" maxlength="150">
            </div>

            <div class="form-group">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj" maxlength="20" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" maxlength="20">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" maxlength="150">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn secondary" onclick="fecharModalCadastrar()">Cancelar</button>
                <button type="submit" class="btn">Salvar empresa</button>
            </div>
        </form>
    </div>
</div>
