<div id="cadastrar-modal" class="modal-overlay" th:fragment="cadastrar">
    <div class="modal">
        <div class="modal-header">
            <div>
                <h3>Adicionar usuário</h3>
                <p>Preencha as informações do novo usuário</p>
            </div>

            <button type="button" class="modal-close" onclick="fecharModalCadastrar()">×</button>
        </div>

        <form class="modal-form" method="post" th:action="@{/admin/usuarios}">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" maxlength="100" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" maxlength="100" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="role">Tipo</label>

                <select id="role" name="role" required>
                    <option value="" selected disabled>
                        Selecione um tipo
                    </option>

                    <option value="ADMIN">Administrador</option>
                    <option value="EMPRESA">Empresa</option>
                    <option value="USER">Usuário</option>
                </select>
            </div>

            <div class="form-group">
                <label for="empresaId">Empresa</label>

                <select id="empresaId" name="empresaId">
                    <option value="" selected>
                        Selecione uma empresa
                    </option>

                    <option
                            th:each="empresa : ${empresas}"
                            th:value="${empresa.id}"
                            th:text="${empresa.razaoSocial}">
                    </option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn secondary" onclick="fecharModalCadastrar()">
                    Cancelar
                </button>

                <button type="submit" class="btn">
                    Salvar usuário
                </button>
            </div>
        </form>
    </div>
</div>
